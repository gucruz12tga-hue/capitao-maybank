workflows:
  android-workflow:
    name: CAPITAO MAYBANK APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Criar pasta android
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
      - name: Permissoes
        script: |
          perl -0pi -e 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n<uses-permission android:name="android.permission.INTERNET"/>\n<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n<application#' android/app/src/main/AndroidManifest.xml
      - name: Dependencias
        script: flutter pub get
      - name: Gerar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
